<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>乐高收藏清单</title>
<style>
:root{
 --bg:#f6f4ef; --card:#fffdf9; --ink:#23201b; --muted:#6f6a60; --line:#e2ddd2;
 --owned:#2e7d5b; --owned-bg:#e6f2ec;
 --buy:#3d7c8a; --buy-bg:#e2f0f2;
 --urgent:#b3261e; --urgent-bg:#fae7e5;
 --sell:#b4611b; --sell-bg:#fbeee0;
 --gone:#6a6f7d; --gone-bg:#eceef2;
 --accent:#4a63b8;
}
@media (prefers-color-scheme:dark){
 :root{
  --bg:#16181c; --card:#1e2126; --ink:#e6e3dd; --muted:#9a958c; --line:#31353c;
  --owned:#68c79b; --owned-bg:#1c2f27;
  --buy:#71b9c9; --buy-bg:#172b30;
  --urgent:#f08b83; --urgent-bg:#331e1c;
  --sell:#e5a05e; --sell-bg:#33261a;
  --gone:#a2a8b5; --gone-bg:#252932;
  --accent:#93a7e8;
 }
}
*{box-sizing:border-box}
body{margin:0;padding:0 16px 72px;background:var(--bg);color:var(--ink);
 font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
.wrap{max-width:1300px;margin:0 auto}
.secnote,.narrow,footer{max-width:900px}
a{color:var(--accent)}
header{padding:28px 0 6px}
h1{font-size:25px;margin:0 0 5px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.modebar{position:sticky;top:0;z-index:9;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);
 margin-bottom:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mb{font-size:13.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);
 padding:6px 14px;border-radius:999px;cursor:pointer;user-select:none}
.mb:hover{border-color:var(--muted)}
.mb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mb.back{margin-right:auto}
.mbl{font-size:12.5px;color:var(--muted);letter-spacing:.3px}
.lang{margin-left:auto;font-weight:600;letter-spacing:.5px;border-color:var(--accent);color:var(--accent)}
.lang:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.sortrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:0 0 14px}
.sortnote{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px}
.seg .sgl{font-size:11.5px;color:var(--muted);padding:0 7px 0 10px;letter-spacing:.3px;white-space:nowrap}
.seg .sg{font-size:12.5px;text-decoration:none;color:var(--muted);padding:4px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg .sg:hover{color:var(--ink)}
.seg .sg.on{background:var(--ink);color:var(--bg)}
h2{font-size:19px;margin:32px 0 3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
h2 .count{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.secnote{color:var(--muted);font-size:13.5px;margin:2px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:10px;align-items:start;margin:10px 0 4px}
.tile{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;
 padding:12px 13px;height:100%;cursor:pointer;display:block;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--muted)}
.tile.own{border-left-color:var(--owned)}
.tile.buy{border-left-color:var(--buy)}
.tile.buy.now{border-left-color:var(--urgent)}
.tile.sell{border-left-color:var(--sell)}
.tile.nope{border-left-color:var(--gone)}
.num{font-size:12px;color:var(--muted);letter-spacing:.6px;font-variant-numeric:tabular-nums}
.nm{font-size:15.5px;font-weight:600;margin:2px 0 0;line-height:1.35}
.en{font-size:12.5px;color:var(--muted);margin:1px 0 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.t-own{background:var(--owned-bg);color:var(--owned)}
.t-buy{background:var(--buy-bg);color:var(--buy)}
.t-urgent{background:var(--urgent-bg);color:var(--urgent)}
.t-sell{background:var(--sell-bg);color:var(--sell)}
.t-gone{background:var(--gone-bg);color:var(--gone)}
.price{margin-left:auto;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.bar{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
 border-radius:0 9px 9px 0;padding:13px 15px;margin:16px 0;max-width:900px;font-size:14px}
.bar.warn{border-left-color:var(--urgent)}
.bar b{font-weight:600}
.bar ul{margin:8px 0 0;padding-left:20px}
.bar li{margin:3px 0}
.tot{display:flex;align-items:baseline;gap:10px;margin:14px 0 0;font-size:14px;color:var(--muted);flex-wrap:wrap}
.tot b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;max-width:900px}
.block h3{margin:0 0 8px;font-size:15px}
.block .bul{margin:0;padding-left:20px}
.block .bul li{margin:4px 0;font-size:14px}
.dtl h1{font-size:22px;margin:6px 0 2px}
.dtl .dsub{color:var(--muted);font-size:13.5px;margin:0 0 4px}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 0;padding-top:14px;
 border-top:1px solid var(--line);font-size:13.5px}
.pn a{text-decoration:none}
.xlinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px;font-size:13px;color:var(--muted)}
.xlinks a{display:inline-block;border:1px dashed var(--line);border-radius:999px;padding:4px 12px;
 text-decoration:none;color:var(--accent)}
.xlinks a:hover{border-style:solid}
footer{margin-top:46px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.empty{color:var(--muted);font-size:14px;margin:12px 0}
</style>
</head>

  name:['魔法部 珍藏版','The Ministry of Magic – Collectors’ Edition'],

var GWP_NOTE = ['<b>如果决定卖：</b>GWP 一般卖到 ARV 的 2–4 倍，但手上这两个不能挂同一个价。未拆封对小赠品的溢价比对大套装更明显。' +
        '这类小件在 <b>BrickLink</b> 比 eBay 好卖 —— 买家是专门凑 GWP 的人，邮费也低，可以和绿顶分开卖，本来就是两拨人。',
        '<b>If they are sold:</b> GWPs go for roughly 2–4× ARV, but these two should not carry the same price. Sealed matters more ' +
        'on small gifts than on large sets. <b>BrickLink</b> suits them better than eBay — the buyers are people completing GWP runs ' +
        'and postage is trivial. Sell them separately from the green-roof castle; it is a different crowd.'];

/* ---------- 工具 ---------- */
function byId(id){ for (var i=0;i<SETS.length;i++) if (SETS[i].id===id) return SETS[i]; return null; }
function numOf(s){ return t(s.num); }
function bucketOf(s){ return s.st === 'now' ? 'buy' : s.st; }
function priceStr(s){ return s.price == null ? '' : '$' + s.price.toFixed(2); }

var FILTS = [
 {k:'all',  lbl:['全部','All']},
 {k:'own',  lbl:ST.own.lbl},
 {k:'buy',  lbl:ST.buy.lbl},
 {k:'sell', lbl:ST.sell.lbl},
 {k:'nope', lbl:ST.nope.lbl}
];
function filtered(){
 if (FILT === 'all') return SETS.slice();
 return SETS.filter(function(s){ return bucketOf(s) === FILT; });
}
function filtTabs(){
 return '<span class="mbl">' + t(UI.filtLbl) + '</span>' + FILTS.map(function(f){
  var n = f.k === 'all' ? SETS.length : SETS.filter(function(s){ return bucketOf(s) === f.k; }).length;
  return '<a class="mb' + (FILT === f.k ? ' on' : '') + '" data-filt="' + f.k + '">' + t(f.lbl) + ' ' + n + '</a>';
 }).join('');
}
function setFilt(v){
 FILT = v;
 try { localStorage.setItem('lego-filt', v); } catch (e) {}
 route(true);
}

/* ---------- 渲染 ---------- */
function tile(s){
 var cls = 'tile ' + bucketOf(s) + (s.st === 'now' ? ' now' : '');
 var h = '<a class="' + cls + '" href="#/s/' + s.id + '">'
   + '<div class="num">' + numOf(s) + '</div>'
   + '<div class="nm">' + t(s.name) + '</div>'
   + '<div class="en">' + s.name[1] + '</div>'
   + '<div class="row"><span class="tag ' + ST[s.st].cls + '">' + t(ST[s.st].lbl) + '</span>';
 if (s.tag) h += '<span class="tag t-gone">' + t(s.tag) + '</span>';
 if (s.price != null) h += '<span class="price">' + priceStr(s) + '</span>';
 h += '</div>';
 if (s.note) h += '<p class="note">' + t(s.note) + '</p>';
 return h + '</a>';
}

function xlinks(){
 return '<div class="xlinks"><span>' + t(UI.xlinkLbl) + '</span>'
  + '<a href="../boardgames/">' + t(UI.xBoard) + '</a>'
  + '<a href="../boardgame/pokemon-tcg/宝可梦清单.html">' + t(UI.xPoke) + '</a>'
  + '<a href="../figures/手办清单.html">' + t(UI.xFigs) + '</a></div>';
}

function sortSeg(){
 var opts = [['series', UI.sortSeries], ['num', UI.sortNum], ['price', UI.sortPrice]];
 var hint = SORT === 'series' ? UI.hintSeries : (SORT === 'num' ? UI.hintNum : UI.hintPrice);
 return '<div class="sortrow"><span class="seg"><span class="sgl">' + t(UI.sortLbl) + '</span>'
  + opts.map(function(o){
    return '<a class="sg' + (SORT === o[0] ? ' on' : '') + '" data-sort="' + o[0] + '">' + t(o[1]) + '</a>';
   }).join('')
  + '</span><span class="sortnote">' + t(hint) + '</span></div>';
}

function renderAll(){
 var list = filtered();
 var h = sortSeg() + xlinks();
 if (!list.length) return h + '<p class="empty">' + t(UI.filtEmpty) + '</p>';

 if (SORT !== 'series'){
  var sorted = list.slice().sort(function(a,b){
   if (SORT === 'num') return String(numOf(a)).localeCompare(String(numOf(b)));
   return (b.price || 0) - (a.price || 0);
  });
  return h + '<div class="grid">' + sorted.map(tile).join('') + '</div>' + totals(list);
 }

 SERIES.forEach(function(sec){
  var items = list.filter(function(s){ return s.series === sec.k; });
  if (!items.length) return;
  h += '<h2>' + t(sec.title);
  if (t(sec.n)) h += '<span class="count">' + t(sec.n) + '</span>';
  h += '</h2><p class="secnote">' + t(sec.note) + '</p>';
  h += '<div class="grid">' + items.map(tile).join('') + '</div>';
  if (sec.k === 'gwp') h += '<div class="bar">' + t(GWP_NOTE) + '</div>';
 });
 return h + totals(list);
}

function totals(list){
 var buy = list.filter(function(s){ return bucketOf(s) === 'buy'; });
 if (!buy.length) return '';
 var sum = buy.reduce(function(a,s){ return a + (s.price || 0); }, 0);
 return '<div class="tot"><span>' + (LANG === 'en' ? 'Still to buy' : '还差')
  + '</span><b>≈ US$' + sum.toFixed(2) + '</b><span>'
  + (LANG === 'en' ? 'roughly CAD $1,050–1,100 · the green-roof sale should cover most of it'
          : '加币大概一千出头 · 绿顶卖掉的钱基本能覆盖') + '</span></div>';
}

function renderSet(id){
 var s = byId(id);
 if (!s) return '<p class="empty">' + t(UI.notfound) + '<a href="#/all">' + t(UI.backlist) + '</a></p>';
 var sec = null;
 SERIES.forEach(function(x){ if (x.k === s.series) sec = x; });

 var h = '<div class="dtl"><div class="num">' + numOf(s) + '</div>'
   + '<h1>' + t(s.name) + '</h1>'
   + '<p class="dsub">' + s.name[1] + (sec ? ' · ' + t(sec.title) : '') + '</p>'
   + '<div class="row" style="margin-bottom:14px">'
   + '<span class="tag ' + ST[s.st].cls + '">' + t(ST[s.st].lbl) + '</span>';
 if (s.tag) h += '<span class="tag t-gone">' + t(s.tag) + '</span>';
 if (s.price != null) h += '<span class="price">' + priceStr(s) + '</span>';
 h += '</div>';

 if (s.note) h += '<div class="block"><h3>' + t(UI.bNotes) + '</h3><p style="margin:0;font-size:14px">' + t(s.note) + '</p></div>';
 if (s.todo && s.todo.length){
  h += '<div class="block"><h3>' + t(UI.bTodo) + '</h3><ul class="bul">'
   + s.todo.map(function(x){ return '<li>' + t(x) + '</li>'; }).join('') + '</ul></div>';
 }
 if (s.series === 'gwp') h += '<div class="bar">' + t(GWP_NOTE) + '</div>';

 var i = SETS.indexOf(s);
 var prev = SETS[(i-1+SETS.length)%SETS.length], next = SETS[(i+1)%SETS.length];
 h += '<div class="pn"><a href="#/s/' + prev.id + '">← ' + t(prev.name) + '</a>'
  + '<a href="#/all">' + t(UI.allup) + '</a>'
  + '<a href="#/s/' + next.id + '">' + t(next.name) + ' →</a></div></div>';
 return h;
}

/* ---------- 路由 ---------- */
function toggleLang(){
 LANG = (LANG === 'zh') ? 'en' : 'zh';
 try { localStorage.setItem('lego-lang', LANG); } catch (e) {}
 route(true);
}
function setSort(v){
 if (SORT === v) return;
 SORT = v;
 try { localStorage.setItem('lego-sort', SORT); } catch (e) {}
 route(true);
}

function route(keepScroll){
 var hash = location.hash || '#/all';
 var app = document.getElementById('app'), bar = document.getElementById('modebar');
 var langBtn = '<a class="mb lang" id="langbtn" title="' + t(UI.langLbl) + '">🌐 '
   + t(UI.langLbl) + '：' + t(UI.langbtn) + '</a>';
 var m = hash.match(/^#\/s\/(.+)$/);

 document.documentElement.lang = (LANG === 'en') ? 'en' : 'zh-CN';
 document.title = t(UI.title);
 document.getElementById('h1').innerHTML = t(UI.title);
 document.getElementById('sub').innerHTML = t(UI.updated);
 document.getElementById('foot').innerHTML = t(UI.foot);

 if (m){
  bar.innerHTML = '<a class="mb back" href="#/all">' + t(UI.allback) + '</a>' + langBtn;
  app.innerHTML = renderSet(m[1]);
 } else {
  bar.innerHTML = filtTabs() + langBtn;
  app.innerHTML = renderAll();
 }
 var sgs = app.querySelectorAll('.sg');
 for (var si = 0; si < sgs.length; si++){
  sgs[si].addEventListener('click', function(){ setSort(this.getAttribute('data-sort')); });
 }
 var fts = bar.querySelectorAll('[data-filt]');
 for (var fi = 0; fi < fts.length; fi++){
  fts[fi].addEventListener('click', function(){ setFilt(this.getAttribute('data-filt')); });
 }
 document.getElementById('langbtn').addEventListener('click', toggleLang);
 if (!keepScroll) window.scrollTo(0, 0);
}

window.addEventListener('hashchange', function(){ route(); });
route(true);
</script>
</body>
</html>
