<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>桌游收藏清单</title>
<style>
:root{
 --bg:#f6f4ef; --card:#fffdf9; --ink:#23201b; --muted:#6f6a60; --line:#e2ddd2;
 --owned:#2e7d5b; --owned-bg:#e6f2ec;
 --cn:#b4611b; --cn-bg:#fbeee0;
 --en:#3d7c8a; --en-bg:#e2f0f2;
 --consider:#8a5fb0; --consider-bg:#f1e9f8;
 --maybe:#6a6f7d; --maybe-bg:#eceef2;
 --warn:#b3261e; --accent:#4a63b8;
}
@media (prefers-color-scheme:dark){
 :root{
  --bg:#16181c; --card:#1e2126; --ink:#e6e3dd; --muted:#9a958c; --line:#31353c;
  --owned:#68c79b; --owned-bg:#1c2f27;
  --cn:#e5a05e; --cn-bg:#33261a;
  --en:#71b9c9; --en-bg:#172b30;
  --consider:#c3a0e0; --consider-bg:#2b2233;
  --maybe:#a2a8b5; --maybe-bg:#252932;
  --warn:#f08b83; --accent:#93a7e8;
 }
 .s-mao{background:#1e2f20;color:#8fc79a}
 .s-mei{background:#33231e;color:#e0a086}
 .s-de{background:#1e2536;color:#9db4e0}
 :root{
 }
}
*{box-sizing:border-box}
body{margin:0;padding:0 16px 72px;background:var(--bg);color:var(--ink);
 font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
.wrap{max-width:1560px;margin:0 auto}
/* 正文类内容不跟着变宽，读起来才不费劲 */
.secnote,.memo,.narrow{max-width:900px}
a{color:var(--accent)}
header{padding:28px 0 6px}
h1{font-size:25px;margin:0 0 5px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.modebar{position:sticky;top:0;z-index:9;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mb{font-size:13.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;cursor:pointer}
.mb:hover{border-color:var(--muted)}
.mb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mb.back{margin-right:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;align-items:start;margin:10px 0 4px}
.grid .card{margin:0;height:100%}
.buyhd{margin:11px 0 3px;font-size:12px;color:var(--muted);letter-spacing:.3px}
.buys{list-style:none;margin:0;padding:0}
.buys li{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:7px;margin-top:7px;border-top:1px solid var(--line)}
.buys li:first-child{border-top:0;margin-top:0;padding-top:0}
.buys li b{font-size:14px;margin-right:2px}
.bn{flex-basis:100%;font-size:12.5px;color:var(--muted);margin:1px 0 0}
.sortrow{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:0 0 6px}
.sortnote{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px}
.seg .sgl{font-size:11.5px;color:var(--muted);padding:0 7px 0 10px;letter-spacing:.3px;white-space:nowrap}
.seg .sg{font-size:12.5px;text-decoration:none;color:var(--muted);padding:4px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg .sg:hover{color:var(--ink)}
.seg .sg.on{background:var(--ink);color:var(--bg)}
.xlinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px;font-size:13px;color:var(--muted)}
.xlinks a{display:inline-block;border:1px dashed var(--line);border-radius:999px;padding:4px 12px;text-decoration:none;color:var(--accent)}
.xlinks a:hover{border-style:solid}
.lang{margin-left:auto;font-weight:600;letter-spacing:.5px;border-color:var(--accent);color:var(--accent)}
.lang:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
h2{font-size:19px;margin:32px 0 3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
h2 .count{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.secnote{color:var(--muted);font-size:13.5px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:12px 15px;margin:9px 0}
.card.owned{border-left-color:var(--owned)}
.card.plan{border-left-color:var(--en)}
.card.consider{border-left-color:var(--consider)}
.card.maybe{border-left-color:var(--maybe)}
.name{font-weight:600;font-size:16.5px;margin:0 0 6px}
.name a{text-decoration:none;color:var(--ink);border-bottom:1.5px dotted var(--muted)}
.name a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 7px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.t-cat{background:transparent;border:1px solid var(--line);color:var(--muted)}
.t-sty{border:1px solid transparent;font-weight:600}
.s-mao{background:#eaf4ea;color:#3d7a45}
.s-mei{background:#f6e8e4;color:#a3502f}
.s-de{background:#e6ecf7;color:#3f5c96}
.t-bgg{background:var(--ink);color:var(--bg);font-weight:600;letter-spacing:.3px}
.card.nope{border-left-color:#9b9b9b;opacity:.72}
.card.sell{border-left-color:#d99b1c}
.t-sell,.tag.t-sell{background:#fff0d6;color:#8a5a00;font-weight:600}
.t-lang{font-weight:600}
.l-cn{background:#fde8e8;color:#a33}
.l-en{background:#e5eefb;color:#2f5599}
.l-tbd{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.t-nope{background:#ececec;color:#6b6b6b;text-decoration:line-through}
.t-sell{background:#fff0d6;color:#8a5a00;font-weight:600}
.idx.nope{border-left-color:#9b9b9b}
.t-owned{background:var(--owned-bg);color:var(--owned)}
.t-plan{background:var(--en-bg);color:var(--en)}
.t-consider{background:var(--consider-bg);color:var(--consider)}
.t-dislike{background:var(--maybe-bg);color:var(--warn);font-weight:600}
.t-lcn{background:var(--cn-bg);color:var(--cn)}
.t-len{background:var(--en-bg);color:var(--en)}
.t-lboth{background:var(--maybe-bg);color:var(--maybe)}
.t-maybe{background:var(--maybe-bg);color:var(--maybe)}
.note{font-size:14px;color:var(--muted);margin:0}
.note b{color:var(--warn);font-weight:600}
.from{font-size:13px;color:var(--muted);margin:0 0 5px}
.from a{text-decoration:none;border-bottom:1px dotted var(--accent)}
.from b{color:var(--ink);font-weight:600}
.xlink{display:inline-block;margin-top:8px;font-size:13px;text-decoration:none;color:var(--accent);
 border:1px solid var(--accent);border-radius:999px;padding:3px 11px}
.xlink:hover{background:var(--accent);color:var(--bg)}
.idxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin:10px 0 4px}
.idx{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;padding:10px 13px}
.idx:hover{border-color:var(--muted)}
.idx.owned{border-left-color:var(--owned)}
.idx.plan{border-left-color:var(--en)}
.idx.consider{border-left-color:var(--consider)}
.idx.maybe{border-left-color:var(--maybe)}
.idx .n{font-weight:600;font-size:14.5px;display:block}
.idx .c{font-size:12px;color:var(--muted)}
.gh{margin:4px 0 2px}
.gh h2{font-size:24px;margin:0 0 8px}
.block{margin:22px 0 0}
.block h3{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.4px;
 border-bottom:1px solid var(--line);padding-bottom:5px}
.have{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 15px;font-size:15px}
.have .none{color:var(--muted)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14px;background:var(--card);
 border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:none}
td b{color:var(--warn)}
ol.todo,ul.bul{padding-left:20px;margin:0}
ol.todo li,ul.bul li{margin:7px 0;font-size:14.5px}
ol.todo b,ul.bul b{color:var(--warn)}
.bigl{display:block;background:var(--card);border:1px solid var(--accent);border-radius:10px;
 padding:12px 15px;text-decoration:none;margin:8px 0}
.bigl:hover{background:var(--accent)}
.bigl .bl-t{font-weight:600;font-size:15px;color:var(--accent);display:block}
.bigl:hover .bl-t,.bigl:hover .bl-d{color:var(--bg)}
.bigl .bl-d{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.pn{display:flex;gap:9px;flex-wrap:wrap;margin:34px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.pn a{font-size:13.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);
 background:var(--card);padding:6px 13px;border-radius:999px}
.pn a:hover{border-color:var(--muted)}
ul.memo{padding-left:18px}
ul.memo li{font-size:14.5px;margin:6px 0;color:var(--muted)}
ul.memo b{color:var(--warn)}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}

/* ---------- 窄屏适配 ---------- */
@media (max-width:560px){
 body{padding:0 12px 60px}
 /* 表格改成自身横向滚动，不再把整页撑宽 */
 table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0;width:auto}
 /* 卡片单栏 */
 .grid{grid-template-columns:minmax(0,1fr)}
 .tag{white-space:normal}
 .card,.card *{overflow-wrap:anywhere;word-break:break-word}
 .card{min-width:0}
 .idxgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
 h1{font-size:22px}
 .modebar{gap:6px;padding:10px 0}
 .mb{padding:5px 11px;font-size:13px}
}

/* ---------- 限时项目标记 ---------- */
.urgent{display:inline-block;background:var(--warn);color:#fff;font-size:12.5px;font-weight:700;
 padding:2px 9px;border-radius:999px;margin:0 6px 3px 0;letter-spacing:.3px}
.card.urgentcard{border-left-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}

/* ---------- 游戏墙 ---------- */
.wlegend{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:0 0 18px;font-size:12.5px;color:var(--muted)}
.wlegend .wll{letter-spacing:.3px}
.wlegend .tag{font-size:11.5px}
.wlegend .wsep{color:var(--line)}
/* 图例本身就是筛选器：点一下只看这一类，再点一下取消 */
.wlegend a{cursor:pointer;text-decoration:none;color:inherit;border:1px solid transparent;
 border-radius:999px;padding:2px 4px;display:inline-flex;align-items:center;gap:4px}
.wlegend a:hover{border-color:var(--muted)}
.wlegend a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wlegend a.on{border-color:var(--ink);background:var(--ink)}
.wlegend a.on,.wlegend a.on .tag{color:var(--bg)}
.wlegend a.on .tag{background:transparent;border-color:var(--bg)}
.wlegend .lgn{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.wclear{margin-left:auto;font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none}
/* 顶栏「只看」标签与 tab 上的计数 */
.mbl{font-size:12px;color:var(--muted);letter-spacing:.3px;margin-right:2px}
.mbn{font-size:11px;opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.mb.on .mbn{opacity:.85}
.wsec{margin:0 0 26px}
.wsec h2{font-size:17px;margin:0 0 4px}
.wsec .secnote{margin:0 0 10px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:9px;
 padding-bottom:13px;border-bottom:3px solid var(--line)}
.wt{position:relative;display:flex;flex-direction:column;text-align:left;min-width:0;
 min-height:196px;height:100%;border:1px solid var(--line);border-radius:10px;
 padding:12px 12px 10px;font:inherit;cursor:pointer;overflow:hidden}
.wt::after{content:"";position:absolute;inset:5px;border:1px solid var(--line);
 border-radius:6px;opacity:.5;pointer-events:none}
.wt.s-none{background:var(--card);color:var(--ink)}
.wt:hover{border-color:var(--muted)}
.wt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.wt>*{position:relative;z-index:1}
.wt .wn{font-weight:600;line-height:1.24;letter-spacing:.2px}
.wt .ws{font-size:11px;line-height:1.35;margin-top:5px;opacity:.7;
 overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wt .wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.wt .tag{font-size:10.5px;padding:1px 7px;white-space:nowrap}
.wt .wf{margin-top:auto;padding-top:9px;display:flex;align-items:center;gap:6px;font-size:11px}
.wbgg{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;opacity:.85;
 font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wmk{opacity:.9;letter-spacing:.5px}
.wt.wsell{opacity:.66}
.wt.wsell .wn{text-decoration:line-through;text-decoration-thickness:1px}
.wcount{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);
 border-radius:999px;padding:1px 8px}

/* 点开后就地展开的详情 —— 内容就是总览清单那张卡 */
.wdet{grid-column:1/-1;border:1px solid var(--muted);border-radius:10px;
 background:var(--bg);padding:4px 12px 12px;margin:1px 0 5px}
.wdet .card{margin:8px 0 0;background:var(--card)}
.wdet .xlink{margin-left:2px}

@media (max-width:560px){
 .wgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
 .wt{padding:11px 10px 9px;min-height:186px}
 .wdet{padding:4px 9px 10px}
}
@media (prefers-reduced-motion:no-preference){
 .wt{transition:border-color .13s ease,opacity .13s ease,box-shadow .13s ease}
}
</style>
</head>
<body>

<div id="app"></div>

<footer id="foot"></footer>

</div>

var LANG = 'zh';
try { var s = localStorage.getItem('bg-lang'); if (s === 'en' || s === 'zh') LANG = s; } catch (e) {}
var SORT = 'group';

/* 风格筛选 '' | 毛 | 美 | 德；标记筛选 '' | sell | need | dislike */
var FSTY = '', FMK = '';
try { FSTY = localStorage.getItem('bg-sty') || ''; FMK = localStorage.getItem('bg-mk') || ''; } catch (e) {}
function t(v){ return Object.prototype.toString.call(v) === '[object Array]' ? (LANG === 'en' ? v[1] : v[0]) : v; }

var UI = {
 title:  ['桌游收藏清单', 'Board Game Collection'],

      'One tile per box; <b>the tile colour is the play style</b> and the figure at bottom right is the BGG rating. <b>Click any box to open it in place</b> — what is in hand, what is still to buy, where from, and condition.'],
 xlinkLbl:['另外三份清单', 'The other three lists'],

 langLbl: ['语言 Language', '语言 Language'],

      'Three buckets: Owned → Considering → Watching. Everything in the buy list is tagged with the edition wanted. Click any game name to open its own page.'],
 introI: ['每款桌游一张卡：手上有什么、还要买什么、在哪买。点游戏名进它自己那页看备注、待办和考据。',
      'One card per game — what is in hand, what is still to buy, and where from. Click a name for its own page with the notes, to-dos and research.'],

   after:['✅ <b>已决定：买 Complete Collection，大盒版路线不要了。</b>2–9 人 / 40–60 分钟 / 10+。这符合你「优先升级大盒／新版」的原则 —— 现在买大盒版，等于买一个注定要被取代的版本，而且还得再单买 Couriers 扩（US\.99）。',
      '✅ <b>Decided: buy the Complete Collection; the Big Box route is dropped.</b> 2–9 players / 40–60 minutes / 10+. This fits the stated preference for the fullest edition — buying the Big Box now means buying something already superseded, and still paying US\.99 separately for Couriers.']},
  {h:['能不能买 / 值不值','Can it be bought, and is it worth it? Checked 2026-09-02'],
   sub:['<b>能买，但还是预购状态，而且价格不低。</b><br>Tycoon Games 官网、Miniature Market、TLAMA games、Team Board Game 都挂着 <b>US$250</b> 的预购。<br>⚠ <b>两个要注意的点</b>：① <b>发售时间已经推迟了</b>。Miniature Market 还挂着「2026 年 4 月」，但那是过期信息 —— 欧洲零售商 TLAMA games 的口径是 <b>「Preorder December 2026」，预计 2027-01-27 前送达</b>。也就是说比原定晚了约 9 个月，而且距今还有 4–5 个月。② US$250 对比「大盒版约 US$40–50 + Couriers 扩 US$39.99 ≈ US$90」，<b>贵了约 US$160</b>。<br><b>这 160 买到的是</b>：十周年扩、十年间全部 promo、定制角色模型、高级收纳。玩法内容上，大盒+Couriers 已经覆盖了四个扩里的三个。',
     '<b>Yes, but it is still a pre-order, and not a cheap one.</b><br>Tycoon Games, Miniature Market, TLAMA games and Team Board Game all list it at <b>US$250</b> for pre-order.<br>⚠ <b>Two caveats</b>: first, the listed release estimate is <b>March-April 2026</b>, yet it is now September and the listings still say pre-order — either delayed or stale, and no official delay notice turned up. Second, US$250 against roughly US$90 for the Big Box (US$40-50) plus the Couriers expansion (US$39.99) is about <b>US$160 more</b>.<br><b>What that buys</b>: the 10th Anniversary expansion, a decade of promos, custom miniatures and premium storage. On gameplay content alone, the Big Box plus Couriers already covers three of the four expansions.'],
   after:['<b>我的看法</b>：如果只是想玩全，大盒 + Couriers 约 US$90 就够，现货可得。US$250 那份溢价主要买的是模型、promo 和收藏属性 —— 值不值取决于你把它当游戏还是当收藏。<br>另外<b>它不是马上能到的东西</b>：最新口径是 2026 年 12 月备货、2027 年 1 月底前送达。<b>没必要现在就把钱压进去</b> —— 可以等临近发售再下单，或者盯现货。价格方面 TLAMA 标 €245.37（原价 €257.74），和美国的 US 差不多。',
      '<b>My read</b>: to simply play the whole game, the Big Box plus Couriers at around US$90 does it, and both are in stock. The US$250 premium mostly buys miniatures, promos and collectability — worth it or not depending on whether this is a game or a collection piece.<br>It is also five months past its stated release, so <b>ask the seller for a real ship date before ordering</b> rather than paying and waiting.']},  {h:['中文版大盒的真伪','Is the Chinese Big Box genuine? Checked 2026-09-02'],
   sub:['<b>结论：几乎可以确定不是正版。</b>三条依据 ——<br>① <b>查不到任何官方中文大盒</b>。Colt Express 由 Ludonaute 出版、Asmodee 发行；中文这边 GoKids 只出过<b>分装的</b>本体、车马飞渡、警长与囚犯三盒，<b>从未出过大盒版</b>。<br>② <b>价格对不上</b>。英文大盒零售约 US$40–50；100 多人民币约合 US$14，连正版成本都不够。<br>③ 这个模式和阿瓦隆那张真伪对照表完全一致：官方没出的版本 + 远低于成本的价格 = 无授权。<br><b>要中文就买 GoKids 那三盒分装的；要全就等 Complete Collection。</b>',
     '<b>Verdict: almost certainly not licensed.</b> Three reasons —<br>1. <b>No official Chinese Big Box exists.</b> Colt Express is published by Ludonaute and distributed by Asmodee; on the Chinese side GoKids has only ever released the base game, Horses &amp; Stagecoach and Marshal &amp; Prisoners as <b>separate boxes</b> — never a Big Box.<br>2. <b>The price does not add up.</b> The English Big Box retails around US$40-50; 100-odd RMB is roughly US$14, below the cost of a legitimate copy.<br>3. The pattern matches the authenticity table on the Avalon page exactly: an edition the publisher never made, at a price below cost, means unlicensed.<br><b>For Chinese, buy the three separate GoKids boxes; for completeness, wait for the Complete Collection.</b>']}
 ],

  ['<b>发行商是 Play to Z</b>。The Game Steward 是美国零售商，众筹时批量下单再转卖，不是发行商。',
   '<b>The publisher is Play to Z.</b> The Game Steward is a US retailer that backs campaigns in bulk and resells the pledges; it is not the publisher.'],
  ['<b>「Sultan&rsquo;s Favor」是豪华版的档位名，不是游戏名</b> —— 游戏是 Play to Z 的 Tales of the Arabian Nights 40 周年版（1985 年原作重制）。找货时用游戏全名搜，只搜 Sultan&rsquo;s Favor 会漏掉大部分卖家。',

  ['<b>零售标准版和豪华版玩法完全一样</b>（200+ 条新故事段落、单人模式都有），差在配件：豪华版是亚克力立牌、木制计数器、秘密目标转盘、刻字骰子、局部 UV 和烫金卡，另加一个<b>飞毯造型的阿拉丁模型</b>（只在豪华版里，只换外观）。标准版是纸板立牌、纸板计数、纸本目标。',

    ['同一游戏历代名字很多：Escape from Atlantis（1982 Waddingtons）→ The Island（Asmodee）→ Survive: Escape from Atlantis!（Stronghold）→ Survive The Island（Zygomatic）。搜的时候几个名字都试。',

 var p = rateParts(g);
 var brk = p.map(function(x){ return t(x.lbl) + ' ' + x.v.toFixed(1); }).join(' · ');
 return '<span class="tag t-bgg" title="' + brk + '">' + t(UI.rateLbl) + ' ' + a.toFixed(1) + '</span>'
   + (p.length > 1 ? '<span class="tag t-cat">' + brk + '</span>' : '');
}
function byBgg(a,b){
 var x = rateAvg(a), y = rateAvg(b);
 x = (x === null) ? -1 : x;
 y = (y === null) ? -1 : y;
 if (x !== y) return y - x;
 return byInitial(a,b);
}

function buyItems(g){ return (g.buy || []).filter(function(it){ return it.bucket !== 'nope'; }); }
var BPRI = ['plan','consider','maybe'];
function primaryBucket(g){
 for (var i = 0; i < BPRI.length; i++){ if (itemsOf(g, BPRI[i]).length) return BPRI[i]; }
 return null;
}
function itemsOf(g, b){
 return (g.buy || []).filter(function(it){ return it.bucket === b; });
}

function fixedCls(b){ return function(){ return b; }; }

/* 另外两份清单 —— 相对路径，这个 html 单独发给别人时点不动，
   就像血染那个说书人练习页的链接一样。自己本机打开才跳得过去。 */
function xlinks(){
 return '<div class="xlinks"><span>' + t(UI.xlinkLbl) + '</span>'
  + '<a href="../lego/">' + t(UI.xLego) + '</a>'
  + '<a href="pokemon-tcg/宝可梦清单.html">' + t(UI.xPoke) + '</a>'
  + '<a href="../figures/手办清单.html">' + t(UI.xFigs) + '</a></div>';
}

function renderAll(){
 var pool = filtered();
 var all = (FILT === 'all');
 var h = '<p class="secnote">' + t(UI.wallHint) + '</p>' + sortSeg() + wallLegend() + xlinks();

 if (!pool.length) return h + '<p class="note">' + t(UI.filtEmpty) + '</p>';

 if (SORT === 'cat'){
  h += catShelves(pool);
 } else if (SORT === 'bgg'){
  var sortedB = pool.slice().sort(byBgg);
  var withB = sortedB.filter(function(g){ return g.bgg !== null && g.bgg !== undefined; }).length;
  h += wallSec(t(UI.sortBgg), withB + ' / ' + pool.length, '', sortedB, true, bucketOf);
 } else if (SORT === 'py'){
  var sorted = pool.slice().sort(byInitial), order = [], groups = {};
  sorted.forEach(function(g){
   var L = initialOf(g);
   if (!groups[L]){ groups[L] = []; order.push(L); }
   groups[L].push(g);
  });
  order.forEach(function(L){ h += wallSec(L, groups[L].length, '', groups[L], true, bucketOf); });
 } else if (FILT === 'nope' || FILT === 'sell'){
  /* 这两档不按采购分档排，直接一架列完 */
  h += wallSec(t(FILT === 'nope' ? BUCKETS.nope.full : BUCKETS.sell.full), pool.length,
         t(FILT === 'nope' ? UI.hintNope : UI.hintSell), pool, true, fixedCls(FILT));
 } else {
  /* 选了某一档时，只出那一档的架 —— 否则点「观望」还会冒出「已买」，很乱 */
  if (all || FILT === 'owned'){
   var owned = pool.filter(function(g){ return g.owned && !g.sell; });
   h += wallSec(t(BUCKETS.owned.full), owned.length, t(UI.hintOwn), owned, true, fixedCls('owned'));
  }

  var SECTIONS = [
   {b:'plan',   own:true, title:UI.secRefill,    hint:UI.hintRefill},
   {b:'plan',   own:false, title:UI.secNewGame,    hint:UI.hintNewGame},
   {b:'consider', own:null, title:BUCKETS.consider.full, hint:UI.hintCons},
   {b:'maybe',  own:null, title:BUCKETS.maybe.full,  hint:UI.hintMay}
  ];
  SECTIONS.forEach(function(sec){
   var b = sec.b;
   if (!all && FILT !== b) return;
   var gs = pool.filter(function(g){
    return primaryBucket(g) === b && (sec.own === null || g.owned === sec.own);
   });
   if (!gs.length) return;
   var n = 0;
   gs.forEach(function(g){ n += buyItems(g).length; });
   h += wallSec(t(sec.title), n, t(sec.hint), gs, true, fixedCls(b));
  });
 }

 /* 不买了／要出这两架，只在「全部」或正好筛到它们时才另起一架 */
 if (all || FILT === 'nope'){
  var nopeGs = pool.filter(function(g){ return itemsOf(g,'nope').length; });
  var nopeN = 0;
  nopeGs.forEach(function(g){ nopeN += itemsOf(g,'nope').length; });
  if (all) h += wallSec(t(BUCKETS.nope.full), nopeN, t(UI.hintNope), nopeGs, true, fixedCls('nope'));
 }
 if (all){
  var sells = pool.filter(function(g){ return g.sell; });
  h += wallSec(t(BUCKETS.sell.full), sells.length, t(UI.hintSell), sells, true, fixedCls('sell'));
 }

 h += '<h2>' + t(UI.bMemo) + '</h2><ul class="memo">'
   + MEMO.map(function(m){ return '<li>' + t(m) + '</li>'; }).join('') + '</ul>';
 return h;
}

function sortSeg(){
 var hint = SORT === 'py' ? UI.sortHint
      : (SORT === 'bgg' ? UI.bggHint
      : (SORT === 'cat' ? UI.catHint : UI.groupHint));
 return '<div class="sortrow"><span class="seg"><span class="sgl">' + t(UI.sortLbl) + '</span>'
  + '<a class="sg' + (SORT === 'group' ? ' on' : '') + '" data-sort="group">' + t(UI.sortGrp) + '</a>'
  + '<a class="sg' + (SORT === 'cat' ? ' on' : '') + '" data-sort="cat">' + t(UI.sortCat) + '</a>'
  + '<a class="sg' + (SORT === 'py' ? ' on' : '') + '" data-sort="py">' + t(UI.sortPy) + '</a>'
  + '<a class="sg' + (SORT === 'bgg' ? ' on' : '') + '" data-sort="bgg">' + t(UI.sortBgg) + '</a></span>'
  + '<span class="sortnote">' + t(hint) + '</span></div>';
}

/* ---------- 游戏墙 ---------- */
/* 盒面底色沿用风格标签那三色；标签文案／语言标签直接复用上面的 styleTag、haveLangTag */
var STYLE_CLS = {'毛':'s-mao', '美':'s-mei', '德':'s-de'};

/* 盒面上中西文各占一行：'矮人矿工 Saboteur' → ['矮人矿工', 'Saboteur'] */
function splitTitle(s){
 s = String(s);
 var i = s.search(/\s[A-Za-z(（]/);
 if (i > 0 && /[一-鿿]/.test(s.slice(0, i))) return [s.slice(0, i), s.slice(i + 1)];
 return [s, ''];
}

/* 真盒面的逻辑：名字越短，字印得越大 */
function tileSize(s){
 var p = String(s).replace(/<[^>]*>/g, '').replace(/&[a-z]+;/gi, 'x'), w = 0;
 for (var i = 0; i < p.length; i++) w += (p.charCodeAt(i) > 255) ? 1 : 0.55;
 if (w <= 4) return 25;
 if (w <= 6) return 21;
 if (w <= 9) return 18;
 if (w <= 13) return 16;
 return 14.5;
}

function wallTile(g, cls, showCat){
 var big, sub;
 if (LANG === 'en'){
  big = t(g.name);
  sub = splitTitle(g.name[0])[0];
 } else {
  var sp = splitTitle(g.name[0]);
  big = sp[0];
  sub = sp[1] || g.name[1] || '';
 }

 var nPlan = itemsOf(g, 'plan').length;
 var mk = '';
 if (g.sell) mk += '💰';
 if (nPlan) mk += '🛒' + (nPlan > 1 ? nPlan : '');
 if (g.dislike) mk += '👎';

 var lg = g.owned ? '' : (langOf(g) ? langTag(langOf(g)) : '');

 return '<button class="wt ' + (STYLE_CLS[g.style] || 's-none') + (g.sell ? ' wsell' : '')
  + '" data-id="' + g.id + '" data-cls="' + cls + '" aria-expanded="false">'
  + '<span class="wn" style="font-size:' + tileSize(big) + 'px">' + big + '</span>'
  + (sub ? '<span class="ws">' + sub + '</span>' : '')
  + '<span class="wtags">'
  + '<span class="tag t-' + cls + '">' + t(BUCKETS[cls].label) + '</span>'
  + (showCat && g.cat ? '<span class="tag t-cat">' + t(g.cat) + '</span>' : '')
  + haveLangTag(g) + lg
  + '</span>'
  + '<span class="wf">'
  + (mk ? '<span class="wmk">' + mk + '</span>' : '')
  + '<span class="wbgg"' + (rateAvg(g) !== null ? ' title="' + rateParts(g).map(function(x){ return t(x.lbl) + ' ' + x.v.toFixed(1); }).join(' · ') + '"' : '')
   + '>' + (rateAvg(g) !== null ? rateAvg(g).toFixed(1) : '') + '</span>'
  + '</span></button>';
}

/* 标记维度：和风格一样，点一下只看这一类 */
/* 「要出」和「还要补」已在顶部筛选条里（sell / plan），这里不再重复 */
var MARKS = [
 {k:'dislike', lbl:UI.dislike,              test:function(g){ return !!g.dislike; }}
];
function markDef(k){
 for (var i = 0; i < MARKS.length; i++) if (MARKS[i].k === k) return MARKS[i];
 return null;
}

/* 图例即筛选器 */
function wallLegend(){
 var h = '<div class="wlegend"><span class="wll">' + t(UI.wallLeg) + '</span>';
 ['毛', '美', '德'].forEach(function(k){
  var n = GAMES.filter(function(g){ return g.style === k; }).length;
  h += '<a data-sty="' + k + '"' + (FSTY === k ? ' class="on"' : '') + '>'
    + styleTag({style:k}) + '<span class="lgn">' + n + '</span></a>';
 });
 h += '<span class="wsep">|</span><span class="wll">' + t(UI.wallMk) + '</span>';
 MARKS.forEach(function(m){
  var n = GAMES.filter(m.test).length;
  h += '<a data-mk="' + m.k + '"' + (FMK === m.k ? ' class="on"' : '') + '>'
    + t(m.lbl) + '<span class="lgn">' + n + '</span></a>';
 });
 if (FSTY || FMK || FILT !== 'all') h += '<a class="wclear" data-clear="1">× ' + t(UI.clearFilt) + '</a>';
 return h + '</div>';
}

/* 一架 = 标题 + 计数 + 说明 + 一格格的盒子 */
function wallSec(title, n, note, list, showCat, clsOf){
 if (!list.length) return '';
 return '<div class="wsec"><h2>' + title + '<span class="wcount">' + n + '</span></h2>'
  + (note ? '<p class="secnote">' + note + '</p>' : '')
  + '<div class="wgrid">'
  + list.map(function(g){ return wallTile(g, clsOf(g), showCat); }).join('')
  + '</div></div>';
}

/* 按分类分架：两款以上的各自一架，只有一款的并到「一类一款」 */
/* ---------- 只看某一档 ---------- */
var FILTS = [
 {k:'all',   lbl:['全部','All'],       test:function(){ return true; }},
 {k:'owned',  lbl:BUCKETS.owned.label,   test:function(g){ return g.owned && !g.sell; }},
 {k:'plan',   lbl:['🤔 考虑买','🤔 Considering'], test:function(g){ return primaryBucket(g) === 'plan'; }},
 {k:'maybe',  lbl:BUCKETS.maybe.label,   test:function(g){ return primaryBucket(g) === 'maybe'; }},
 {k:'nope',   lbl:BUCKETS.nope.label,   test:function(g){ return itemsOf(g, 'nope').length > 0; }},
 {k:'sell',   lbl:BUCKETS.sell.label,   test:function(g){ return !!g.sell; }}
];
function filtDef(k){
 for (var i = 0; i < FILTS.length; i++) if (FILTS[i].k === k) return FILTS[i];
 return FILTS[0];
}
/* 三个维度是「且」的关系：状态 × 风格 × 标记 */
function filtered(){
 var bt = filtDef(FILT).test, mk = markDef(FMK);
 return GAMES.filter(function(g){
  if (!bt(g)) return false;
  if (FSTY && g.style !== FSTY) return false;
  if (mk && !mk.test(g)) return false;
  return true;
 });
}
function filtTabs(){
 return FILTS.map(function(f){
  var n = GAMES.filter(f.test).length;
  return '<a class="mb' + (FILT === f.k ? ' on' : '') + '" data-filt="' + f.k + '">'
    + t(f.lbl) + '<span class="mbn">' + n + '</span></a>';
 }).join('');
}
function setFilt(v){
 if (FILT === v) return;
 FILT = v;
 try { localStorage.setItem('bg-filt', FILT); } catch (e) {}
 route(true);
}
/* 风格／标记：点已选中的那个＝取消 */
function setSty(v){
 FSTY = (FSTY === v) ? '' : v;
 try { localStorage.setItem('bg-sty', FSTY); } catch (e) {}
 route(true);
}
function setMk(v){
 FMK = (FMK === v) ? '' : v;
 try { localStorage.setItem('bg-mk', FMK); } catch (e) {}
 route(true);
}
function clearFilts(){
 FILT = 'all'; FSTY = ''; FMK = '';
 try {
  localStorage.setItem('bg-filt', FILT);
  localStorage.setItem('bg-sty', '');
  localStorage.setItem('bg-mk', '');
 } catch (e) {}
 route(true);
}

function catShelves(list){
 var order = [], groups = {};
 list.forEach(function(g){
  var k = g.cat ? t(g.cat) : t(UI.wallNoStyle);
  if (!groups[k]){ groups[k] = []; order.push(k); }
  groups[k].push(g);
 });
 var multi = order.filter(function(k){ return groups[k].length > 1; })
          .sort(function(a, b){ return groups[b].length - groups[a].length; });
 var singles = order.filter(function(k){ return groups[k].length === 1; })
           .map(function(k){ return groups[k][0]; });

 var h = '';
 multi.forEach(function(k){ h += wallSec(k, groups[k].length, '', groups[k], false, bucketOf); });
 h += wallSec(t(UI.wallOthers), singles.length, t(UI.wallOthNote), singles, true, bucketOf);
 return h;
}

/* 点开一格 —— 在同一行下面就地展开总览清单那张卡 */
function toggleDetail(tile){
 var openTile = document.querySelector('.wt.on');
 var openPanel = document.querySelector('.wdet');
 var same = (openTile === tile);
 if (openPanel) openPanel.parentNode.removeChild(openPanel);
 if (openTile){ openTile.classList.remove('on'); openTile.setAttribute('aria-expanded', 'false'); }
 if (same) return;

 var g = byId(tile.getAttribute('data-id'));
 if (!g) return;
 var cls = tile.getAttribute('data-cls');
 tile.classList.add('on');
 tile.setAttribute('aria-expanded', 'true');

 var d = document.createElement('div');
 d.className = 'wdet';
 d.innerHTML = gameCard(g, cls, (cls === 'nope' ? itemsOf(g, 'nope') : buyItems(g)), true)
   + '<a class="xlink" href="#/g/' + g.id + '">' + t(UI.wallFull) + ' →</a>';

 /* 插到本行最后一格之后，这样展开的面板整行铺开、不在行里留洞 */
 var grid = tile.parentNode, last = tile, top = tile.offsetTop;
 var tiles = grid.querySelectorAll('.wt');
 for (var i = 0; i < tiles.length; i++){ if (tiles[i].offsetTop === top) last = tiles[i]; }
 grid.insertBefore(d, last.nextSibling);
}

function renderGame(id){
 return '<div class="narrow">' + renderGameInner(id) + '</div>';
}

function renderGameInner(id){
 var g = byId(id);
 if (!g) return '<p>' + t(UI.notfound) + '<a href="#/list">' + t(UI.backlist) + '</a></p>';
 var b = bucketOf(g);
 var lg = g.owned ? null : langOf(g);
 var h = '<div class="gh"><h2>' + t(g.name) + '</h2>'
  + '<div class="tags"><span class="tag t-' + b + '">' + t(BUCKETS[b].label) + '</span>'
  + (lg ? langTag(lg) : '')
  + '<span class="tag t-cat">' + t(g.cat) + '</span></div></div>';

 h += '<div class="block"><h3>' + t(UI.bHave) + '</h3><div class="have">'
  + (g.owned ? t(g.have || ['本体','Base game'])
        : '<span class="none">' + t(g.have || UI.notowned) + '</span>')
  + '</div></div>';

 if (g.links && g.links.length){
  h += '<div class="block"><h3>' + t(UI.bLinks) + '</h3>';
  g.links.forEach(function(l){
   h += '<a class="bigl" href="' + encodeURI(l.href) + '" target="_blank">'
    + '<span class="bl-t">' + t(l.title) + ' ↗</span>'
    + '<span class="bl-d">' + t(l.desc) + '</span></a>';
  });
  h += '</div>';
 }

 if (g.buy && g.buy.length){
  h += '<div class="block"><h3>' + t(UI.bBuy) + '</h3><div class="tblwrap"><table><tr>'
   + '<th>' + t(UI.thItem) + '</th><th>' + t(UI.thKind) + '</th><th>' + t(UI.thLang)
   + '</th><th>' + t(UI.thWhere) + '</th><th>' + t(UI.thStat) + '</th></tr>';
  g.buy.forEach(function(it){
   var n = t(it.note);
   h += '<tr><td>' + t(it.item) + '</td><td>' + t(it.kind) + '</td><td>' + t(it.lang) + '</td><td>'
    + t(it.where) + '</td><td>' + t(BUCKETS[it.bucket].label) + (n ? '<br>' + n : '') + '</td></tr>';
  });
  h += '</table></div></div>';
 }

 if (g.todo && g.todo.length){
  h += '<div class="block"><h3>' + t(UI.bTodo) + '</h3><ol class="todo">'
   + g.todo.map(function(x){ return '<li>' + t(x) + '</li>'; }).join('') + '</ol></div>';
 }

 (g.blocks||[]).forEach(function(bl){
  h += '<div class="block"><h3>' + t(bl.h) + '</h3>';
  if (bl.sub) h += '<p class="secnote">' + t(bl.sub) + '</p>';
  if (bl.bul) h += '<ul class="bul">' + bl.bul.map(function(x){ return '<li>' + t(x) + '</li>'; }).join('') + '</ul>';
  if (bl.table){
   h += '<div class="tblwrap" style="margin-top:10px"><table><tr>'
    + bl.table.head.map(function(x){ return '<th>' + t(x) + '</th>'; }).join('') + '</tr>'
    + bl.table.rows.map(function(r){
      return '<tr>' + r.map(function(c){ return '<td>' + t(c) + '</td>'; }).join('') + '</tr>';
     }).join('')
    + '</table></div>';
  }
  if (bl.after) h += '<p class="note" style="margin-top:10px">' + t(bl.after) + '</p>';
  h += '</div>';
 });

 if (g.notes && g.notes.length){
  h += '<div class="block"><h3>' + t(UI.bNotes) + '</h3><ul class="bul">'
   + g.notes.map(function(n){ return '<li>' + t(n) + '</li>'; }).join('') + '</ul></div>';
 }

 var i = GAMES.indexOf(g);
 var prev = GAMES[(i-1+GAMES.length)%GAMES.length], next = GAMES[(i+1)%GAMES.length];
 h += '<div class="pn"><a href="#/g/' + prev.id + '">← ' + t(prev.name) + '</a>'
  + '<a href="#/all">' + t(UI.allup) + '</a>'
  + '<a href="#/g/' + next.id + '">' + t(next.name) + ' →</a></div>';
 return h;
}

function toggleLang(){
 LANG = (LANG === 'zh') ? 'en' : 'zh';
 try { localStorage.setItem('bg-lang', LANG); } catch (e) {}
 route(true);
}

function setSort(v){
 if (SORT === v) return;
 SORT = v;
 try { localStorage.setItem('bg-sort', SORT); } catch (e) {}
 route(true);
}

function route(keepScroll){
 var hash = location.hash || '#/list';
 var app = document.getElementById('app'), bar = document.getElementById('modebar');
 var langBtn = '<a class="mb lang" id="langbtn" title="' + t(UI.langLbl) + '">🌐 '
   + t(UI.langLbl) + '：' + t(UI.langbtn) + '</a>';
 var m = hash.match(/^#\/g\/(.+)$/);

 document.documentElement.lang = (LANG === 'en') ? 'en' : 'zh-CN';
 document.title = t(UI.title).replace('&amp;', '&');
 document.getElementById('h1').innerHTML = t(UI.title);
 document.getElementById('sub').innerHTML = t(UI.updated);
 document.getElementById('foot').innerHTML = t(UI.foot);

 if (m){
  bar.innerHTML = '<a class="mb back" href="#/all">' + t(UI.allback) + '</a>' + langBtn;
  app.innerHTML = renderGame(m[1]);
 } else {
  bar.innerHTML = '<span class="mbl">' + t(UI.filtLbl) + '</span>' + filtTabs() + langBtn;
  app.innerHTML = renderAll();
 }
 var sgs = app.querySelectorAll('.sg');
 for (var si = 0; si < sgs.length; si++){
  sgs[si].addEventListener('click', function(){ setSort(this.getAttribute('data-sort')); });
 }
 var fts = bar.querySelectorAll('[data-filt]');
 for (var fi = 0; fi < fts.length; fi++){
  fts[fi].addEventListener('click', function(){ setFilt(this.getAttribute('data-filt')); });
 }
 var lgs = app.querySelectorAll('.wlegend a');
 for (var li = 0; li < lgs.length; li++){
  lgs[li].addEventListener('click', function(){
   if (this.getAttribute('data-clear')) return clearFilts();
   if (this.getAttribute('data-sty')) return setSty(this.getAttribute('data-sty'));
   if (this.getAttribute('data-mk')) return setMk(this.getAttribute('data-mk'));
  });
 }
 document.getElementById('langbtn').addEventListener('click', toggleLang);
 if (!keepScroll) window.scrollTo(0, 0);
}

/* 点格子就地展开 —— 挂在 #app 上，重渲染后依然有效 */
document.getElementById('app').addEventListener('click', function(e){
 var el = e.target;
 while (el && el !== this && !(el.classList && el.classList.contains('wt'))) el = el.parentNode;
 if (el && el !== this && el.classList && el.classList.contains('wt')) toggleDetail(el);
});

window.addEventListener('hashchange', function(){ route(); });
route(true);
</script>
</body>
